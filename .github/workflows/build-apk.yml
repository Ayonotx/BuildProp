name: Build Mobile APK

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install mobile deps
        run: npm ci
        working-directory: mobile

      - name: Sync Capacitor (www -> android assets)
        run: npx cap sync android
        working-directory: mobile

      - name: Create signing keystore for this build
        run: |
          keytool -genkeypair -v \
            -keystore buildprop-release.keystore \
            -alias buildprop -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass buildprop123 -keypass buildprop123 \
            -dname "CN=BuildProp, OU=BuildProp, O=BuildProp, L=Accra, ST=Greater Accra, C=GH"
        working-directory: mobile

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: mobile/android

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildProp-Monitor-APK
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14