name: BuildProp Mobile — Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mobile/**'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './mobile/package-lock.json'

      - name: Setup EAS (Expo Application Services)
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK via EAS
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: Get build status
        run: |
          echo "APK build submitted to EAS!"
          echo "Check https://expo.dev/accounts/[your-account]/projects/BuildProp/builds for the APK download link."