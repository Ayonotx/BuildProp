<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="color-scheme" content="light">
  <title>BuildProp Admin</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Login -->
  <section id="login-view">
    <div class="login-card">
      <div class="login-logo">🏗️</div>
      <h1>BuildProp</h1>
      <p class="login-sub">Mobile admin app · Owner / CEO</p>

      <button id="btn-qr" class="btn btn-primary btn-big" type="button">📷 Link with QR</button>

      <div class="login-divider"><span>or sign in manually</span></div>

      <label for="login-server">Server Address</label>
      <input id="login-server" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://192.168.1.50:3456">

      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="you@company.com">

      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="••••••••">

      <div id="conn-status" class="conn-status"></div>

      <button id="btn-signin" class="btn btn-outline" type="button">Sign in manually</button>
      <button id="btn-test" class="link-btn" type="button">Test connection</button>

      <div id="login-error" class="login-error"></div>

      <div class="login-foot">
        <button id="btn-manual-code" class="link-btn" type="button">or paste a pairing code manually</button>
      </div>

      <div id="manual-code-box" class="manual-code-box hidden">
        <label for="manual-code-input">Paste the full pairing code (the JSON shown under the QR on your computer)</label>
        <textarea id="manual-code-input" class="form-textarea" rows="3" placeholder='{"v":1,"s":"http://192.168.1.50:3456","k":"…"}'></textarea>
        <button id="btn-manual-code-submit" class="btn btn-outline" type="button">Link with code</button>
      </div>
    </div>
  </section>

  <!-- QR scanner overlay -->
  <div id="qr-overlay" class="hidden">
    <div class="qr-topbar">
      <span class="qr-title">Scan BuildProp QR</span>
      <button id="qr-close" class="icon-btn qr-close" type="button">✕</button>
    </div>
    <div class="qr-stage">
      <video id="qr-video" autoplay playsinline muted></video>
      <div class="qr-frame"></div>
      <div id="qr-status" class="qr-status">Starting camera…</div>
    </div>
    <canvas id="qr-canvas" class="hidden"></canvas>
    <div class="qr-foot">
      <p class="muted small">Point the camera at the QR code shown in BuildProp on your computer. The code expires after 5 minutes.</p>
      <button id="btn-qr-manual" class="link-btn light" type="button">or enter the pairing code manually</button>
      <div id="qr-manual-box" class="manual-code-box hidden">
        <textarea id="qr-manual-input" class="form-textarea" rows="3" placeholder='{"v":1,"s":"http://192.168.1.50:3456","k":"…"}'></textarea>
        <button id="btn-qr-manual-submit" class="btn btn-outline" type="button">Link with code</button>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app-view" class="hidden">
    <header id="app-header">
      <button id="btn-back" class="icon-btn hidden" data-action="back" type="button">←</button>
      <h1 id="header-title">BuildProp Admin</h1>
      <button id="btn-alerts" class="icon-btn hidden" data-action="alerts" type="button" title="Alerts">🔔<span id="alert-count" class="hidden">0</span></button>
      <button id="btn-refresh" class="icon-btn hidden" data-action="refresh" type="button">⟳</button>
    </header>

    <div id="ptr">Pull to refresh</div>

    <main id="screen-container"></main>

    <nav id="tabbar">
      <button class="tab-btn" data-tab="home" type="button"><span class="tab-icon">🏠</span><span class="tab-label">Home</span></button>
      <button class="tab-btn" data-tab="projects" type="button"><span class="tab-icon">🏗️</span><span class="tab-label">Projects</span></button>
      <button class="tab-btn" data-tab="finance" type="button"><span class="tab-icon">💰</span><span class="tab-label">Finance</span></button>
      <button class="tab-btn" data-tab="contacts" type="button"><span class="tab-icon">👥</span><span class="tab-label">Contacts</span></button>
      <button class="tab-btn" data-tab="settings" type="button"><span class="tab-icon">⚙️</span><span class="tab-label">Settings</span></button>
    </nav>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="icon-btn modal-close" type="button">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading" class="hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <div id="loading-text">Loading…</div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden"></div>

  <script src="js/jsQR.js"></script>
  <script src="js/api.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
